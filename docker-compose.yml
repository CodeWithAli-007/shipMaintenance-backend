services:
  postgres:
    image: postgres:16-alpine
    container_name: ship-maintenance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ship_maintenance
    ports:
      - '5432:5432'
    volumes:
      - ship_maintenance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ship_maintenance']
      interval: 5s
      timeout: 5s
      retries: 10

  matrix-postgres:
    image: postgres:16-alpine
    container_name: ship-maintenance-matrix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${MATRIX_POSTGRES_PASSWORD:-synapse-local-only}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - ship_maintenance_matrix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U synapse -d synapse']
      interval: 5s
      timeout: 5s
      retries: 10

  matrix-init:
    image: alpine:3.22
    container_name: ship-maintenance-matrix-init
    volumes:
      - ./matrix:/data
    environment:
      MATRIX_REGISTRATION_SHARED_SECRET: ${MATRIX_REGISTRATION_SHARED_SECRET:-local-development-registration-secret-change-me}
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        printf '%s' "$$MATRIX_REGISTRATION_SHARED_SECRET" > /data/registration.secret
        if [ ! -s /data/signing.key ]; then
          printf 'ed25519 a_1 %s\n' "$$(head -c 32 /dev/urandom | base64 | tr -d '\n=')" > /data/signing.key
        fi

  matrix:
    image: matrixdotorg/synapse:v1.138.0
    container_name: ship-maintenance-matrix
    restart: unless-stopped
    depends_on:
      matrix-postgres:
        condition: service_healthy
      matrix-init:
        condition: service_completed_successfully
    ports:
      - '8008:8008'
    volumes:
      - ./matrix:/data
      - ship_maintenance_matrix_media:/data/media_store
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8008/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  ship_maintenance_pgdata:
  ship_maintenance_matrix_pgdata:
  ship_maintenance_matrix_media:
