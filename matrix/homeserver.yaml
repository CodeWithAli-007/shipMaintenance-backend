server_name: "ship-maintenance.local"
public_baseurl: "http://localhost:8008/"
pid_file: /data/homeserver.pid
web_client_location: ""

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client]
        compress: false

database:
  name: psycopg2
  args:
    user: synapse
    password: synapse-local-only
    database: synapse
    host: matrix-postgres
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: /data/log.config
media_store_path: /data/media_store
signing_key_path: /data/signing.key
registration_shared_secret_path: /data/registration.secret
macaroon_secret_key: "replace-this-local-development-macaroon-secret"
form_secret: "replace-this-local-development-form-secret"

enable_registration: false
enable_registration_without_verification: false
allow_guest_access: false
allow_public_rooms_without_auth: false
allow_public_rooms_over_federation: false
federation_domain_whitelist: []
room_list_publication_rules: []
enable_room_list_search: false
encryption_enabled_by_default_for_room_type: all
forgotten_room_retention_period: 7d
max_upload_size: 50M

trusted_key_servers: []
suppress_key_server_warning: true
report_stats: false
